name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: GitHub mints a short-lived token that Azure trusts for this repo's main branch only.
permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: restaurant-feedback-45200
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build React front end
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test API
        run: dotnet test tests/RestaurantFeedback.Api.Tests --configuration Release

      - name: Publish API with the front end in wwwroot
        run: |
          rm -rf src/RestaurantFeedback.Api/wwwroot
          cp -r web/dist src/RestaurantFeedback.Api/wwwroot
          dotnet publish src/RestaurantFeedback.Api --configuration Release --output publish

      - name: Sign in to Azure (OIDC, no stored passwords)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish
